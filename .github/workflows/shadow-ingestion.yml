name: Shadow market observation

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: shadow-market-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALPACA_MARKET_DATA_KEY_ID: ${{ secrets.ALPACA_MARKET_DATA_KEY_ID }}
      ALPACA_MARKET_DATA_SECRET_KEY: ${{ secrets.ALPACA_MARKET_DATA_SECRET_KEY }}
      SOLANA_READ_ONLY_RPC_URL: ${{ secrets.SOLANA_READ_ONLY_RPC_URL }}
      TRADING_DB_PATH: ${{ secrets.SHADOW_DATABASE_URL }}
      TRADING_DB_SCHEMA: shadow_evidence_v2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore disposable full working set
        uses: actions/cache/restore@v5
        with:
          path: var/full-working-set.db
          key: full-working-set-v1-${{ github.run_id }}
          restore-keys: full-working-set-v1-

      - name: Install
        run: pip install -e .

      - name: Require persistent shadow database
        run: |
          if [[ -z "$TRADING_DB_PATH" ]]; then
            echo "SHADOW_DATABASE_URL must be configured for shadow persistence" >&2
            exit 1
          fi

      - name: Verify persistent shadow database
        id: persistence_check
        run: trading-bot persistence-check

      - name: Attest unavailable persistent evidence
        if: ${{ always() && steps.persistence_check.outcome != 'success' }}
        run: |
          reason="${{ steps.persistence_check.outputs.reason || 'database_not_configured' }}"
          {
            echo "## Shadow evidence unavailable"
            echo
            case "$reason" in
              neon_data_transfer_quota_exceeded)
                echo "Persistent preflight reason: Neon data-transfer quota exceeded."
                ;;
              database_not_configured)
                echo "Persistent preflight reason: shadow database is not configured."
                ;;
              unsupported_database_location)
                echo "Persistent preflight reason: configured database is not PostgreSQL."
                ;;
              integrity_check_failed)
                echo "Persistent preflight reason: database integrity check failed."
                ;;
              *)
                echo "Persistent preflight reason: database is unavailable."
                ;;
            esac
            echo
            echo "Persistent preflight failed. No collection, scoring, health, economic, reconciliation, or retrospective replacement evidence ran."
            echo
            echo "Restore the configured persistent database before a later scheduled observation can count as prospective evidence."
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p var/reports
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > var/reports/persistence-unavailable.json <<EOF
          {
            "observed_at": "${observed_at}",
            "status": "persistent_preflight_failed",
            "reason": "${{ steps.persistence_check.outputs.reason || 'database_not_configured' }}",
            "workflow": "${{ github.workflow }}",
            "trigger": "${{ github.event_name }}",
            "head_sha": "${{ github.sha }}",
            "plan": "config/shadow-ingestion.json",
            "evidence_collected": false,
            "retrospective_replacement_used": false
          }
          EOF

      - name: Upload persistent-evidence availability attestation
        if: ${{ always() && hashFiles('var/reports/persistence-unavailable.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-persistence-unavailable-${{ github.run_id }}
          path: var/reports/persistence-unavailable.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate observation plan
        run: trading-bot shadow-cycle --plan config/shadow-ingestion.json --validate-only

      - name: Register research baselines
        run: trading-bot research-init

      - name: Collect and research
        run: >-
          trading-bot shadow-cycle
          --plan config/shadow-ingestion.json
          --working-set-cache var/full-working-set.db
          --max-neon-egress-bytes 1400000
          --egress-report var/reports/full-neon-egress.md
          --observation-origin ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}

      - name: Publish full-cycle egress accounting
        if: ${{ always() && hashFiles('var/reports/full-neon-egress.md') != '' }}
        run: cat var/reports/full-neon-egress.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save disposable full working set
        if: ${{ always() && steps.persistence_check.outcome == 'success' && hashFiles('var/full-working-set.db') != '' }}
        uses: actions/cache/save@v5
        with:
          path: var/full-working-set.db
          key: full-working-set-v1-${{ github.run_id }}

      - name: Reconcile Alpaca paper account
        if: ${{ env.ALPACA_MARKET_DATA_KEY_ID != '' && env.ALPACA_MARKET_DATA_SECRET_KEY != '' }}
        run: trading-bot paper-reconcile

      - name: Run economic eligibility gate
        run: |
          trading-bot economic-report \
            --costs config/economic-costs.json

      - name: Enforce ingestion health
        # A failed preflight means the durable store is unavailable, so a second
        # connection cannot yield a trustworthy health report. Still attest health
        # after any later collection failure once preflight has succeeded.
        if: ${{ always() && steps.persistence_check.outcome == 'success' }}
        run: |
          trading-bot shadow-health \
            --plan config/shadow-ingestion.json \
            --max-age-minutes 90 \
            --format text

      - name: Publish operational scorecard
        # The scorecard is derived from durable evidence and must not be generated
        # from an unavailable store.
        if: ${{ always() && steps.persistence_check.outcome == 'success' }}
        run: |
          trading-bot daily-scorecard \
            --plan config/shadow-ingestion.json \
            --costs config/economic-costs.json \
            --format markdown \
            --output var/reports/daily-scorecard.md \
            --json-output var/reports/daily-scorecard.json \
            --emit-github-alerts \
            ${{ github.event_name == 'schedule' && '--fail-on-rapid-continuity' || '' }}
          cat var/reports/daily-scorecard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily scorecard
        if: ${{ always() && hashFiles('var/reports/daily-scorecard.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: daily-scorecard
          path: var/reports
          if-no-files-found: error
          retention-days: 90
