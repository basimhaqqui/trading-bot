name: Crypto perpetual sandbox

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/crypto-sandbox.yml"
      - "config/crypto-sandbox.json"
      - "src/trading_bot/execution/crypto_sandbox.py"
      - "src/trading_bot/execution/__init__.py"
      - "src/trading_bot/cli.py"
      - "tests/test_crypto_sandbox.py"

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Run isolated crypto and perpetual scenarios
        run: |
          trading-bot crypto-sandbox \
            --scenario all \
            --format markdown \
            --output var/reports/crypto-sandbox.md
          cat var/reports/crypto-sandbox.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sandbox report
        uses: actions/upload-artifact@v7
        with:
          name: crypto-perpetual-sandbox
          path: var/reports/crypto-sandbox.md
          if-no-files-found: error
          retention-days: 30
