name: Rapid shadow evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "22,37,52 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: shadow-market-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    # Keep the scheduled cycle bounded below its 15-minute cadence. Twelve
    # minutes proved insufficient for a complete persistent-Neon observation.
    timeout-minutes: 14
    env:
      TRADING_DB_PATH: ${{ secrets.SHADOW_DATABASE_URL }}
      TRADING_DB_SCHEMA: shadow_evidence_v2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Require persistent shadow database
        run: |
          if [[ -z "$TRADING_DB_PATH" ]]; then
            echo "SHADOW_DATABASE_URL must be configured for shadow persistence" >&2
            exit 1
          fi

      - name: Verify persistent shadow database
        id: persistence_check
        run: trading-bot persistence-check

      - name: Attest unavailable persistent evidence
        if: ${{ always() && steps.persistence_check.outcome == 'failure' }}
        run: |
          {
            echo "## Shadow evidence unavailable"
            echo
            echo "Persistent preflight failed. No collection, scoring, health, or retrospective replacement evidence ran."
            echo
            echo "Restore the configured persistent database before a later scheduled observation can count as prospective evidence."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate rapid observation plan
        run: trading-bot shadow-cycle --plan config/rapid-shadow-ingestion.json --validate-only

      - name: Register research baselines
        run: trading-bot research-init

      - name: Collect rapid evidence and score outcomes
        run: >-
          trading-bot shadow-cycle
          --plan config/rapid-shadow-ingestion.json
          --research-profile rapid
          --observation-origin ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}

      - name: Enforce rapid ingestion health
        # A failed preflight means the durable store is unavailable, so a second
        # connection cannot yield a trustworthy health report. Still attest health
        # after any later collection failure once preflight has succeeded.
        if: ${{ always() && steps.persistence_check.outcome == 'success' }}
        run: >-
          trading-bot shadow-health
          --plan config/rapid-shadow-ingestion.json
          --max-age-minutes 30
          --max-consecutive-failures 0
          --format markdown
