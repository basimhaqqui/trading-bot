name: Rapid shadow evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "22,37,52 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: shadow-market-observation
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    # Keep the scheduled cycle bounded below its 15-minute cadence. Twelve
    # minutes proved insufficient for a complete persistent-Neon observation.
    timeout-minutes: 14
    env:
      TRADING_DB_PATH: ${{ secrets.SHADOW_DATABASE_URL }}
      TRADING_DB_SCHEMA: shadow_evidence_v2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore disposable rapid working set
        uses: actions/cache/restore@v5
        with:
          path: var/rapid-working-set.db
          key: rapid-working-set-v1-${{ github.run_id }}
          restore-keys: rapid-working-set-v1-

      - name: Install
        run: pip install -e .

      - name: Require persistent shadow database
        run: |
          if [[ -z "$TRADING_DB_PATH" ]]; then
            echo "SHADOW_DATABASE_URL must be configured for shadow persistence" >&2
            exit 1
          fi

      - name: Verify persistent shadow database
        id: persistence_check
        run: trading-bot persistence-check

      - name: Attest unavailable persistent evidence
        if: ${{ always() && steps.persistence_check.outcome != 'success' }}
        run: |
          reason="${{ steps.persistence_check.outputs.reason || 'database_not_configured' }}"
          {
            echo "## Shadow evidence unavailable"
            echo
            case "$reason" in
              neon_data_transfer_quota_exceeded)
                echo "Persistent preflight reason: Neon data-transfer quota exceeded."
                ;;
              database_not_configured)
                echo "Persistent preflight reason: shadow database is not configured."
                ;;
              unsupported_database_location)
                echo "Persistent preflight reason: configured database is not PostgreSQL."
                ;;
              integrity_check_failed)
                echo "Persistent preflight reason: database integrity check failed."
                ;;
              *)
                echo "Persistent preflight reason: database is unavailable."
                ;;
            esac
            echo
            echo "Persistent preflight failed. No collection, scoring, health, or retrospective replacement evidence ran."
            echo
            echo "Restore the configured persistent database before a later scheduled observation can count as prospective evidence."
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p var/reports
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > var/reports/persistence-unavailable.json <<EOF
          {
            "observed_at": "${observed_at}",
            "status": "persistent_preflight_failed",
            "reason": "${{ steps.persistence_check.outputs.reason || 'database_not_configured' }}",
            "workflow": "${{ github.workflow }}",
            "trigger": "${{ github.event_name }}",
            "head_sha": "${{ github.sha }}",
            "plan": "config/rapid-shadow-ingestion.json",
            "evidence_collected": false,
            "retrospective_replacement_used": false
          }
          EOF

      - name: Upload persistent-evidence availability attestation
        if: ${{ always() && hashFiles('var/reports/persistence-unavailable.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: rapid-persistence-unavailable-${{ github.run_id }}
          path: var/reports/persistence-unavailable.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate rapid observation plan
        run: trading-bot shadow-cycle --plan config/rapid-shadow-ingestion.json --validate-only

      - name: Register research baselines
        run: trading-bot research-init

      - name: Collect rapid evidence and score outcomes
        run: >-
          trading-bot shadow-cycle
          --plan config/rapid-shadow-ingestion.json
          --research-profile rapid
          --working-set-cache var/rapid-working-set.db
          --max-neon-egress-bytes 1400000
          --egress-report var/reports/rapid-neon-egress.md
          --observation-origin ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}

      - name: Publish rapid egress accounting
        if: ${{ always() && hashFiles('var/reports/rapid-neon-egress.md') != '' }}
        run: cat var/reports/rapid-neon-egress.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save disposable rapid working set
        if: ${{ always() && steps.persistence_check.outcome == 'success' && hashFiles('var/rapid-working-set.db') != '' }}
        uses: actions/cache/save@v5
        with:
          path: var/rapid-working-set.db
          key: rapid-working-set-v1-${{ github.run_id }}

      - name: Enforce rapid ingestion health
        # A failed preflight means the durable store is unavailable, so a second
        # connection cannot yield a trustworthy health report. Still attest health
        # after any later collection failure once preflight has succeeded.
        if: ${{ always() && steps.persistence_check.outcome == 'success' }}
        run: >-
          trading-bot shadow-health
          --plan config/rapid-shadow-ingestion.json
          --max-age-minutes 30
          --max-consecutive-failures 0
          --format markdown

      - name: Verify rapid evidence continuity
        # Receipt-only telemetry keeps the rapid workflow's own continuity gate
        # low-egress. A missed window remains visible and cannot be backfilled.
        if: ${{ always() && steps.persistence_check.outcome == 'success' }}
        run: |
          trading-bot rapid-continuity \
            --plan config/rapid-shadow-ingestion.json \
            --format markdown \
            --output var/reports/rapid-continuity.md \
            --json-output var/reports/rapid-continuity.json
          cat var/reports/rapid-continuity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rapid continuity report
        if: ${{ always() && hashFiles('var/reports/rapid-continuity.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: rapid-continuity-${{ github.run_id }}
          path: |
            var/reports/rapid-continuity.md
            var/reports/rapid-continuity.json
          if-no-files-found: error
          retention-days: 90
